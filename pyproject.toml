[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mental-health-data-analysis"
version = "0.1.0"
description = "Exploratory analysis of a mental health survey dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<4",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
